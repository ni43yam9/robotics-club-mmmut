<meta charset="UTF-8" />

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { background:#0A0C10; margin:0; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; }
  .font-heading { font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }

  @keyframes team-marquee-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .team-marquee-track {
    animation: team-marquee-scroll var(--marquee-duration, 30s) linear infinite;
    will-change: transform;
  }
  .team-marquee:hover .team-marquee-track,
  .team-marquee:focus-within .team-marquee-track {
    animation-play-state: paused;
  }
  .team-card {
    transition: transform .3s ease, border-color .3s ease;
  }
  .team-card:hover, .team-card:focus-within {
    transform: translateY(-4px);
    border-color: #C97C3E;
    outline: none;
  }
  .team-card-image {
    filter: grayscale(1);
    transition: filter .4s ease, transform .4s ease;
  }
  .team-card:hover .team-card-image,
  .team-card:focus-within .team-card-image {
    filter: grayscale(0);
    transform: scale(1.03);
  }
  .line-clamp-1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  @media (prefers-reduced-motion: reduce) {
    .team-marquee-track { animation:none; }
    .team-card, .team-card-image { transition:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

/* ---------------- data ---------------- */

function slugify(name) {
  return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function withImages(list) {
  return list.map((m) => ({ ...m, image: m.image || `team/${slugify(m.name)}.jpg` }));
}

  { name: "Srishti Tripathi", role: "Editorial and Content Research Lead", department: "EE" },
  { name: "Srishti Yadav", role: "Graphics Design Lead", department: "ECE-IoT" },

/* ---------------- components ---------------- */

function TeamCard({ member, ariaHidden, className = "" }) {
  const { name, role, department, image } = member;
  const fallback = `https://ui-avatars.com/api/?background=1B1F27&color=C97C3E&bold=true&size=256&name=${encodeURIComponent(name)}`;
  return (
    <article
      className={`team-card group relative select-none overflow-hidden rounded-xl border border-[#23272F] bg-[#14171D] flex flex-col justify-between ${className || "w-40 shrink-0 sm:w-48 md:w-52 lg:w-56"}`}
      tabIndex={ariaHidden ? -1 : 0}
      aria-hidden={ariaHidden || undefined}
    >
      <div className="relative aspect-[3/4] w-full overflow-hidden bg-[#1B1F27]">
        <img
          src={image}
          alt={`Portrait of ${name}`}
          loading="lazy"
          className="team-card-image h-full w-full object-cover object-top"
          onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = fallback; }}
        />
      </div>
      <div className="min-h-[5.5rem] px-3.5 py-3 flex-1 flex flex-col justify-between">
        <div>
          <p className="line-clamp-2 text-sm font-semibold leading-snug text-[#ECEEF1]" title={name}>{name}</p>
          <p className="mt-1 line-clamp-1 text-xs text-[#C97C3E]" title={role}>{role}</p>
        </div>
        {department ? <p className="mt-1 line-clamp-1 text-[11px] text-[#9BA1AC]" title={department}>{department}</p> : null}
      </div>
    </article>
  );
}

function TeamMarquee({ members, direction = "left", speed }) {
  const duration = speed ?? Math.max(members.length * 4, 18);
  const track = useMemo(() => [...members, ...members], [members]);
  return (
    <div className="team-marquee relative w-full overflow-hidden" style={{ maskImage: "linear-gradient(to right, transparent, black 6%, black 94%, transparent)", WebkitMaskImage: "linear-gradient(to right, transparent, black 6%, black 94%, transparent)" }}>
      <div
        className="team-marquee-track flex w-max gap-4 px-4 md:px-8"
        style={{ "--marquee-duration": `${duration}s`, animationDirection: direction === "right" ? "reverse" : "normal" }}
      >
        {track.map((m, i) => <TeamCard key={`${m.name}-${i}`} member={m} ariaHidden={i >= members.length} />)}
      </div>
    </div>
  );
}

function TeamSection({ title, members, direction }) {
  if (!members?.length) return null;
  if (members.length <= 5) {
    return (
      <section className="py-8 md:py-12">
        <div className="mx-auto max-w-6xl px-4 md:px-8">
          <h2 className="font-heading mb-6 text-lg font-semibold tracking-tight text-[#ECEEF1] md:text-xl">{title}</h2>
          <div className="flex flex-nowrap overflow-x-auto pb-2 md:pb-0 md:grid md:grid-cols-5 gap-3 sm:gap-4 lg:gap-5 scrollbar-none">
            {members.map((m) => (
              <TeamCard key={m.name} member={m} className="w-40 sm:w-44 md:w-full shrink-0 md:shrink" />
            ))}
          </div>
        </div>
      </section>
    );
  }
  return (
    <section className="py-8 md:py-12">
      <div className="mx-auto max-w-6xl px-4 md:px-8">
        <h2 className="font-heading mb-6 text-lg font-semibold tracking-tight text-[#ECEEF1] md:text-xl">{title}</h2>
      </div>
      <TeamMarquee members={members} direction={direction} />
    </section>
  );
}

function TeamHeader() {
  return (
    <header className="mx-auto max-w-6xl px-4 pb-6 pt-16 text-center md:px-8 md:pt-24">
      <p className="text-xs font-medium text-[#C97C3E]">Robotics Club, MMMUT</p>
      <h1 className="font-heading mt-3 text-3xl font-semibold tracking-tight text-[#ECEEF1] md:text-5xl">Meet the team</h1>
      <p className="mx-auto mt-4 max-w-md text-sm text-[#9BA1AC] md:text-base">The people behind Robotics Club MMMUT.</p>
    </header>
  );
}

function TeamPage() {
  return (
    <main className="min-h-screen bg-[#0A0C10]">
      <TeamHeader />
      <TeamSection title="Faculties" members={facultyAdvisors} direction="left" />
      <TeamSection title="Final Year Members" members={finalYearMembers} direction="right" />
      <TeamSection title="Third Year Members" members={thirdYearMembers} direction="left" />
      <TeamSection title="Second Year Members" members={secondYearMembers} direction="right" />
      <div className="h-10 md:h-16" />
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TeamPage />);
</script>
</body>
