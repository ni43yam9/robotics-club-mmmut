<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: black; display: flex; gap: 20px; padding: 50px; }
    .box { width: 200px; height: 200px; position: relative; border-radius: 50%; overflow: hidden; }
    
    /* Simulate yellow wireframe/outline */
    .logo-yellow-fake {
      position: absolute; inset: 0; width: 100%; height: 100%;
      /* invert white to black, black to white */
      filter: invert(1) sepia(1) saturate(100) hue-rotate(5deg) contrast(2);
      mix-blend-mode: screen;
    }

    /* Simulate normal multiply logo */
    .logo-multiply {
      position: absolute; inset: 0; width: 100%; height: 100%;
      mix-blend-mode: multiply;
    }

    .liquid {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
      background: #FACC15;
    }
  </style>
</head>
<body>
  
  <!-- Step 3: Yellow fake outline -->
  <div class="box">
    <img class="logo-yellow-fake" src="test-logo.png" />
  </div>

  <!-- Step 6: Liquid rising with black logo -->
  <div class="box" style="background: white;">
    <div class="liquid"></div>
    <img class="logo-multiply" src="test-logo.png" />
  </div>
</body>
</html>
